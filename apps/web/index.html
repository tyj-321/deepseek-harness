<!doctype html>
<html lang="en">
  <head>
    <script>
      // Polyfill crypto.randomUUID for non-secure contexts (HTTP + IP/hostname).
      // Browsers only expose crypto.randomUUID in secure contexts (HTTPS or
      // localhost); on plain HTTP it is undefined and throws "is not a function".
      // This fallback uses crypto.getRandomValues (available in all contexts).
      (function () {
        if (typeof crypto !== 'undefined' && typeof crypto.randomUUID !== 'function') {
          var bytes = new Uint8Array(16);
          crypto.randomUUID = function () {
            crypto.getRandomValues(bytes);
            // RFC 4122 version 4 + variant bits
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            var hex = [];
            for (var i = 0; i < 16; i++) hex.push(bytes[i].toString(16).padStart(2, '0'));
            return (
              hex.slice(0, 4).join('') + '-' + hex.slice(4, 6).join('') + '-' +
              hex.slice(6, 8).join('') + '-' + hex.slice(8, 10).join('') + '-' +
              hex.slice(10, 16).join('')
            );
          };
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI智能体聊天</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
